name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject.toml declares; the rest guard against
        # regressions on current interpreters.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Test
        run: python -m pytest tests/ -q
      - name: CLI contract - clean tree exits 0
        # Scan the package source, which is clean, so exit code 0 is the
        # assertion. Scanning the repository root is NOT a valid check: the
        # rule fixtures in tests/ contain the pattern strings on purpose, so
        # that scan finds findings and exits 1 by design.
        run: agentbound scan agentbound

      - name: CLI contract - findings exit 1
        # The other half of the documented contract, and the half users depend
        # on: `scan` is meant to gate CI. Without this step a scanner that
        # always exited 0 would pass CI while silently disabling every user's
        # gate. The fixture is the smallest file that trips one rule.
        run: |
          mkdir -p /tmp/agentbound-dirty
          printf 'import logging\n\n\ndef register(tools_dict, tool):\n    logging.warning("Duplicate tool name %%r", tool.name)\n    tools_dict[tool.name] = tool\n' > /tmp/agentbound-dirty/dup.py
          if agentbound scan /tmp/agentbound-dirty; then
            echo "expected a non-zero exit when findings exist"; exit 1
          fi
          echo "exit code 1 on findings: ok"
