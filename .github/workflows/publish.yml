name: Publish

# `pip install <name>` is how most people first meet a tool, and three of these packages were
# not installable from PyPI at all - they existed only as a git URL, which is a discovery
# channel that requires the reader to already know the project exists.
#
# This uses PyPI Trusted Publishing (OIDC), so there is no API token in this repository and
# none to leak. It needs ONE piece of setup that only the account owner can do:
#
#   pypi.org -> Your account -> Publishing -> "Add a new pending publisher"
#     PyPI project name : <the name below>
#     Owner             : sushant-me
#     Repository name   : <this repository>
#     Workflow name     : publish.yml
#     Environment name  : pypi
#
# After that, publishing a GitHub release publishes the package. Until then the job builds
# the distributions, skips the upload, and writes the setup steps above to the job summary -
# a red run on every release would say nothing about this repository's code. Set the
# repository variable PYPI_PUBLISH to `true` once the pending publisher exists.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the metadata before it is published
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token the trusted publisher exchanges
    steps:
      # Publishing is opt-in until this project has a PyPI trusted publisher. Without one,
      # the upload step fails with `invalid-publisher` on every release: a red run that says
      # nothing about this repository's code and that nothing in this repository can fix.
      # The setup is one page - pypi.org -> Your account -> Publishing - so the gate states
      # it instead of leaving a permanent red X on every release.
      - name: Is publishing enabled for this repository?
        id: gate
        env:
          ENABLED: ${{ vars.PYPI_PUBLISH }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "publishing enabled (PYPI_PUBLISH=true)"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### PyPI publishing is not enabled"
            echo ""
            echo "The distributions were built and are attached to this run; nothing was uploaded."
            echo ""
            echo "To enable it: add a pending publisher at pypi.org -> Your account -> Publishing"
            echo "(owner sushant-me, repository agentbound, workflow publish.yml, environment pypi),"
            echo "then set the repository variable PYPI_PUBLISH to true."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::PyPI publishing is disabled for this repository (set PYPI_PUBLISH=true once a trusted publisher exists)."
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.gate.outputs.ready == 'true'
